name: Release

# Publishing a GitHub Release publishes the same version to npm. npm authenticates this workflow
# with trusted publishing (OIDC), so there is no npm token, and adds provenance to the package.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "release tag ${{ github.event.release.tag_name }} does not match package.json $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run size
      - name: Publish unless this version is already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "tinylance@$version" version >/dev/null 2>&1; then
            echo "tinylance@$version is already on npm, skipping"
          else
            npm publish
          fi
